services:
  frontend:
    image: nike
    container_name: nike
    build: 
      context: .
      dockerfile: docker/Dockerfile.test
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - "3000:3000"
    networks:
      - nike-net
    volumes:
      - my-volume:/data
    command: sh -c "cp -r /data/static/ ./static/ && node server.js"
    depends_on:
      database:
        condition: service_healthy
      db_migration:
        condition: service_completed_successfully
  
  db_migration:
    image: nike-migrate
    container_name: dbmigrate
    build: 
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
    networks:
      - nike-net
    restart: "no"
    volumes:
      - my-volume:/data
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:14.23-alpine
    container_name: postgresdb
    restart: always
    networks:
      - nike-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nikedb"]
      timeout: 3s
      retries: 3
      interval: 5s
      start_period: 5s
  
networks:
  nike-net:
    name: nike-net
    driver: bridge

volumes:
  my-volume:     